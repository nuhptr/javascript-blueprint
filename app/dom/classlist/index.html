<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>classList</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 600px;
                margin: 20px auto;
                transition: background 0.2s;
            }

            .styles {
                color: crimson;
                font-weight: normal;
                text-decoration: line-through;
            }

            .highlight {
                background: gold;
            }

            .dark-theme {
                background: #111;
                color: white;
            }
        </style>
    </head>
    <body>
        <h1 class="title styles">Hello World</h1>
        <button type="button" class="theme-toggle">Ganti tema</button>

        <script src="index.js"></script>
    </body>
</html>
