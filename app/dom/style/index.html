<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Style</title>
        <style>
            body {
                font-family: sans-serif;
                max-width: 600px;
                margin: 20px auto;
            }

            h1 {
                color: crimson;
            }

            .container {
                padding: 20px;
            }

    </head>

        <!-- Bagian 1: inline style dan computed style -->
        <h1 class="title" style="color: teal">Hello World</h1>

        <!-- Bagian 2: latihan -->
        <div class="container">

            <p class="sub-heading">
                Belajar mengubah tampilan elemen secara dinamis menggunakan JavaScript bersama
                anmastery.
            </p>
            <a href="#" class="learn-more">Learn More</a>
        </div>

        <script src="index.js"></script>
    </body>
</html>
